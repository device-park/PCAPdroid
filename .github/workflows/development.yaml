name: Build PCAPdroid Headless APK

on:
  push:
    branches:
      - TLT-4693


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make build script executable
        run: chmod +x build_headless_pcapdroid.sh

      - name: Build Headless APK
        run: ./build_headless_pcapdroid.sh

      - name: Verify APK
        run: |
          ls -lh releases
          test -f releases/pcapdroid-headless.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pcapdroid-headless
          path: releases/pcapdroid-headless.apk
          if-no-files-found: error