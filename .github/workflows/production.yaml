
name: Build PCAPdroid Headless APK

on:
  release:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICEPARK_URL: https://devicepark.testinium.io
  ANDROID_PLATFORM: 35
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_NDK: 28.2.13676358
  ANDROID_CMAKE: 3.22.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Verify Android SDK
        run: |
          set -euo pipefail

          echo "Android SDK verification..."

          sdkmanager --version

          test -d "${ANDROID_HOME}/platform-tools"
          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_PLATFORM}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK}"
          test -d "${ANDROID_HOME}/cmake/${ANDROID_CMAKE}"

          echo "Android SDK components are ready."

      - name: Make build script executable
        run: |
          chmod +x build_headless_pcapdroid.sh

      - name: Build Headless APK
        run: |
          set -euo pipefail

          ./build_headless_pcapdroid.sh

      - name: Verify APK
        run: |
          set -euo pipefail

          ls -lh releases

          test -f releases/pcapdroid-headless.apk

          echo "PCAPdroid APK generated successfully."

      - name: Extract Tag Version
        id: version
        run: |
          set -euo pipefail

          RAW_TAG="${{ github.ref_name }}"

          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION#V}"

          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from tag"
            exit 1
          fi

          echo "Prod Version to Deploy: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get OAuth Token
        env:
          CLIENT_ID: ${{ secrets.DEVICEPARK_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DEVICEPARK_CLIENT_SECRET }}
          AUTH_URL: ${{ env.DEVICEPARK_URL }}/uaa/oauth2/token

        run: |
          set -euo pipefail

          TOKEN=$(curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "$AUTH_URL" \
            --user "${CLIENT_ID}:${CLIENT_SECRET}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=openid" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OAuth token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "DEVICEPARK_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Upload APK to DevicePark Prod
        env:
          VERSION: ${{ steps.version.outputs.version }}

        run: |
          set -euo pipefail

          APK="releases/pcapdroid-headless.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            exit 1
          fi

          if [ -z "${VERSION}" ]; then
            echo "Application version is empty"
            exit 1
          fi

          if [ -z "${DEVICEPARK_TOKEN:-}" ]; then
            echo "OAuth token is empty"
            exit 1
          fi

          echo "Uploading PCAP APK version: ${VERSION} to PROD"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --location \
            --header "Authorization: Bearer ${DEVICEPARK_TOKEN}" \
            --form "file=@${APK}" \
            "${DEVICEPARK_URL}/management/api/v1/private/system-apps/upload?platform=ANDROID&appType=PCAP&appVersion=${VERSION}"

          echo
          echo "Upload completed successfully."

          unset DEVICEPARK_TOKEN

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcapdroid-headless-prod-${{ steps.version.outputs.version }}
          path: releases/pcapdroid-headless.apk
          if-no-files-found: error

